<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
      width: 100%;
      height: 100%;
      min-height: 150px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 12px 20px;

      /* Pastel mint background */
      background: #e6f3ec80;

      border-radius: 22px;
    }

    .time {
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(70px, 18vw, 180px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.06em;
      white-space: nowrap;
    }

    /* Coral hours */
    .hours {
      color: #058686;
    }

    /* Teal colon + minutes */
    .colon,
    .minutes {
      color: #058686;
    }

    .colon {
      margin: 0 0.03em;
    }

    .date {
      margin-top: 16px;

      color: #de4144;
      font-size: clamp(14px, 3.4vw, 27px);
      font-weight: 500;

      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .clock {
        border-radius: 16px;
        padding: 10px;
      }

      .date {
        margin-top: 10px;
        letter-spacing: 0.14em;
      }
    }
  </style>
</head>

<body>

  <div class="clock">

    <div class="time">
      <span class="hours" id="hours">18</span>
      <span class="colon">:</span>
      <span class="minutes" id="minutes">45</span>
    </div>

    <div class="date" id="date">
      FRIDAY
      AUGUST 28
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours =
        now.getHours().toString().padStart(2, "0");

      const minutes =
        now.getMinutes().toString().padStart(2, "0");

      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;

      const date =
        new Intl.DateTimeFormat("en-CA", {
          weekday: "long",
          month: "long",
          day: "numeric"
        })
        .format(now)
        .toUpperCase();

      document.getElementById("date").textContent = date;
    }

    updateClock();

    setInterval(updateClock, 1000);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastel Notion Clock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .clock {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 180px;
      overflow: hidden;
      border-radius: 24px;

      background-color: #e5f3ef;

      /* cream dash pattern */
      background-image:
        radial-gradient(
          ellipse at center,
          rgba(255, 248, 233, 0.95) 0 40%,
          transparent 45%
        );

      background-size: 55px 65px;
      background-position: 0 0;

      box-shadow:
        0 6px 18px rgba(70, 90, 85, 0.12),
        inset 0 0 35px rgba(255,255,255,0.22);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 14px 24px;
    }

    /* decorative cream bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 40% 35%,
          rgba(255,255,255,0.95),
          rgba(255,246,231,0.8)
        );
      opacity: 0.8;
      filter: blur(0.2px);
    }

    .bubble.one {
      width: 115px;
      height: 115px;
      left: -42px;
      bottom: -32px;
    }

    .bubble.two {
      width: 90px;
      height: 90px;
      left: 38px;
      bottom: -18px;
    }

    .bubble.three {
      width: 76px;
      height: 76px;
      right: -18px;
      top: 35px;
    }

    .bubble.four {
      width: 92px;
      height: 92px;
      right: -32px;
      top: 86px;
    }

    .time {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(70px, 18vw, 180px);
      font-weight: 500;
      line-height: 0.88;
      letter-spacing: -0.06em;
      white-space: nowrap;
    }

    .hours {
      color: #ff646d;
    }

    .colon,
    .minutes {
      color: #63a396;
    }

    .colon {
      margin: 0 0.02em;
    }

    .date {
      position: relative;
      z-index: 2;

      margin-top: 18px;
      color: #63a396;

      font-size: clamp(14px, 3.6vw, 28px);
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .clock {
        border-radius: 18px;
        padding: 10px 14px;
      }

      .date {
        margin-top: 12px;
        letter-spacing: 0.16em;
      }
    }
  </style>
</head>

<body>
  <div class="clock">
    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>
    <div class="bubble four"></div>

    <div class="time">
      <span class="hours" id="hours">18</span>
      <span class="colon">:</span>
      <span class="minutes" id="minutes">45</span>
    </div>

    <div class="date" id="date">
      FRIDAY, AUGUST 28
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const hours = now.getHours().toString().padStart(2, "0");
      const minutes = now.getMinutes().toString().padStart(2, "0");

      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;

      const date = new Intl.DateTimeFormat("en-CA", {
        weekday: "long",
        month: "long",
        day: "numeric"
      })
        .format(now)
        .toUpperCase();

      document.getElementById("date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>

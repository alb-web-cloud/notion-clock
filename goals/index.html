<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goal completion</title>
<style>
:root{--bg:#e6f3ec80;--text:#37352f;--muted:#787774;--grid:rgba(55,53,47,.10);--weekly:#eb7165;--monthly:#198f8d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{background:var(--bg);overflow:hidden}.widget{height:100vh;min-height:250px;padding:16px 22px 14px 14px}.title{text-align:center;font-size:17px;font-weight:600;line-height:24px;margin:0 0 16px}.chart{height:calc(100% - 74px);display:grid;grid-template-columns:42px 1fr;position:relative}.axis{position:relative;border-right:1px solid var(--grid)}.tick{position:absolute;right:8px;font-size:12px;color:var(--muted);transform:translateY(50%)}.plot{position:relative}.line{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}.bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding:0 12%}.col{width:36%;height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:min(120px,82%);position:relative;border-radius:9px 9px 0 0;min-height:2px}.weekly{height:50%;background:var(--weekly)}.monthly{height:100%;background:var(--monthly)}.value{position:absolute;left:50%;top:-27px;transform:translateX(-50%);font-size:14px;font-weight:600;white-space:nowrap}.labels{height:34px;margin-left:42px;display:flex;justify-content:space-around;padding:8px 12% 0}.label{width:36%;text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="widget">
  <div class="title">% completed</div>
  <div class="chart">
    <div class="axis">
      <span class="tick" style="bottom:0%">0%</span>
      <span class="tick" style="bottom:25%">25%</span>
      <span class="tick" style="bottom:50%">50%</span>
      <span class="tick" style="bottom:75%">75%</span>
      <span class="tick" style="bottom:100%">100%</span>
    </div>
    <div class="plot">
      <div class="line" style="bottom:0%"></div><div class="line" style="bottom:25%"></div><div class="line" style="bottom:50%"></div><div class="line" style="bottom:75%"></div><div class="line" style="bottom:100%"></div>
      <div class="bars">
        <div class="col"><div class="bar weekly"><span class="value">50%</span></div></div>
        <div class="col"><div class="bar monthly"><span class="value">100%</span></div></div>
      </div>
    </div>
  </div>
  <div class="labels"><div class="label">Weekly</div><div class="label">Monthly</div></div>
</div>
</body>
</html>
